name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Deliberately no MySQL service: these tests must stay hermetic, so the
    # money arithmetic can be exercised on every push in seconds.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (tests not yet run)
        run: mvn -B -DskipTests package

      - name: Run unit tests
        run: mvn -B test

  integration:
    name: Integration tests (real MySQL 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Testcontainers starts MySQL itself, so the runner only needs Docker,
    # which ubuntu-latest already provides.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify (unit + integration)
        run: mvn -B verify

  reconciliation-service:
    name: Reconciliation service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reconciliation-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: reconciliation-service/requirements.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
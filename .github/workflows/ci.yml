name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Deliberately no MySQL service: these tests must stay hermetic, so the
    # money arithmetic can be exercised on every push in seconds.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (tests not yet run)
        run: mvn -B -DskipTests package

      - name: Run unit tests
        run: mvn -B test

  integration:
    name: Integration tests (real MySQL 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Testcontainers starts MySQL itself, so the runner only needs Docker,
    # which ubuntu-latest already provides.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify (unit + integration)
        run: mvn -B verify

  reconciliation-service:
    name: Reconciliation service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reconciliation-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: reconciliation-service/requirements.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  backend-application-demo:
    name: Disposable Compose transaction and reconciliation demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test demo start-up retry
        run: python3 -m unittest scripts.test_backend_application_demo

      - name: Start seeded MySQL and Java core
        run: docker compose up -d --build mysql core

      - name: Start reconciliation with a scoped demo OPS token
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null
          ops_token=$(python3 -c 'from scripts.backend_application_demo import login; print(login("ops", "ChangeMe123!"))')
          CORE_SERVICE_TOKEN="$ops_token" docker compose up -d --build reconciliation

      - name: Exercise the transaction and reconciliation APIs
        run: python3 scripts/backend_application_demo.py

      - name: Record Compose state
        if: always()
        run: |
          mkdir -p demo-results
          docker compose ps > demo-results/compose-ps.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-application-demo
          path: demo-results/
          retention-days: 30

      - name: Remove disposable demo stack
        if: always()
        run: docker compose down -v
